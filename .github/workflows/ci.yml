name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-View

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF

      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-View

      # stub の version / features は `Cargo.toml` から導出する (literal を書かない)
      # workflow に literal を置くと source of truth が 2 つになり、path dep の
      # version を動かした commit で CI が resolve 段階から落ちる 判定 (どの dep を
      # stub にしてよいか) も script 側で機械的に出す 詳細は make-stubs.py の docstring
      - name: Create dependency stubs
        shell: bash
        run: python3 ALICE-View/.github/make-stubs.py

      - name: Build (default)
        working-directory: ALICE-View
        run: cargo build --lib

      - name: Test
        working-directory: ALICE-View
        run: cargo test --lib

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
