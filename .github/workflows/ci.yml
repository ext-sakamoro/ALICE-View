name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-View


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-View


      - name: Build (default)
        working-directory: ALICE-View
        run: cargo build --lib

      - name: Test
        working-directory: ALICE-View
        run: cargo test --lib

      # The bridge sits behind an optional feature, so the default build never
      # compiles it. It was broken for that reason: it imported a `prelude`
      # module that no longer exists, and nothing noticed.
      - name: Check the analytics bridge (optional feature)
        working-directory: ALICE-View
        run: cargo check --lib --features analytics

      # every optional bridge (lol, analytics, physics, db) against the real crate: the ALICE crates are git
      # dependencies (branch main), so nothing is stubbed and nothing is checked out next to this repository
      - name: Test (all features)
        working-directory: ALICE-View
        run: cargo test --lib --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      # RUSTSEC-2026-0235 interim: this crate must not depend on rkyv directly
      # or archive anything through it (rkyv is reached only via alice-db, whose
      # archived types hold no Rc / Arc). The guard fails as soon as that changes.
      - name: no-direct-rkyv guard (tests)
        run: python3 scripts/test_no_direct_rkyv.py
      - name: no-direct-rkyv guard
        run: python3 scripts/no_direct_rkyv.py

  web:
    name: Render thread renderer (crates/alice-view-web)
    # ubuntu-24.04, not ubuntu-latest: ubuntu-latest moved to 26.04, where Playwright 1.56.1 installs no
    # Chromium ("Playwright does not support chromium on ubuntu26.04-x64")
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/alice-view-web
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy (wasm32, with and without the probe)
        run: |
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --release --target wasm32-unknown-unknown --features probe -- -D warnings

      # the CLI must be the same version as the wasm-bindgen crate the build resolved
      - name: Install wasm-bindgen-cli
        run: |
          v=$(cargo metadata --format-version 1 | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'wasm-bindgen'))")
          cargo install wasm-bindgen-cli --version "$v" --locked

      - name: Size gate
        run: python3 probe/size.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Browser checks (SwiftShader WebGPU, then none)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server -d probe 18802 --bind 127.0.0.1 &
          sleep 2
          ln -s "$PWD/node_modules" probe/node_modules
          # the runner's WebGPU is SwiftShader, which loses the device while a second pipeline compiles
          # asynchronously on a render thread (measured with a plain-JS render thread too): the async pipeline is measured on a real
          # GPU, not here; the device, the mirror, the fallback and the size are
          PROBE_WEBGL=swiftshader PROBE_CHROME_ARGS="--use-webgpu-adapter=swiftshader" node probe/gpuinfo.mjs http://127.0.0.1:18802/index.html
          PROBE_ADAPTER=swiftshader PROBE_ASYNC=skip PROBE_CHROME_ARGS="--use-webgpu-adapter=swiftshader" node probe/check.mjs http://127.0.0.1:18802/index.html webgpu
          node probe/check.mjs http://127.0.0.1:18802/index.html none

      # Mesa's software Vulkan (lavapipe): with it installed and Chromium's Vulkan flags, the device stays alive (without
      # it, the same lane lost its device: the step is load-bearing, measured 2026-11-08). What Chromium then reports is
      # printed first, and the lane asserts it
      - name: Install Mesa software Vulkan (lavapipe)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name "lvp_icd*.json" | head -1)
          echo "lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee /tmp/vulkaninfo.txt | head -40
          grep -qi llvmpipe /tmp/vulkaninfo.txt

      - name: Browser checks on software WebGPU over Mesa Vulkan (20 runs)
        run: |
          python3 -m http.server -d probe 18803 --bind 127.0.0.1 &
          sleep 2
          flags="--use-angle=vulkan --ignore-gpu-blocklist --disable-gpu-sandbox --disable-vulkan-surface"
          PROBE_WEBGL=llvmpipe PROBE_CHROME_ARGS="$flags" node probe/gpuinfo.mjs http://127.0.0.1:18803/index.html
          failed=0
          for i in $(seq 1 20); do
            # 512 steps: at the default 96 this software adapter compiles the slow pipeline in 30-50 ms, too short to
            # hold the frames the check counts (a run under 100 ms is "not measured")
            PROBE_LANE_COUNTS_STALLS=1 PROBE_STEPS=512 PROBE_ADAPTER=swiftshader PROBE_CHROME_ARGS="$flags" node probe/check.mjs http://127.0.0.1:18803/index.html webgpu > "/tmp/lane-$i.txt" 2>&1 || failed=$((failed + 1))
          done
          tail -12 /tmp/lane-1.txt
          echo "software WebGPU over Mesa Vulkan: $failed of 20 runs failed"
          for i in $(seq 1 20); do grep -h FAIL "/tmp/lane-$i.txt" || true; done | sort | uniq -c
          # every run's gap while compiling and in its control window with no compile, side by side
          for i in $(seq 1 20); do echo "run $i: $(grep -h '^compile ' "/tmp/lane-$i.txt" | cut -d, -f4) | $(grep -h '^control ' "/tmp/lane-$i.txt" | cut -d: -f2)"; done
          # a run whose compile was too short to hold frames does not measure the async pipeline
          measured=$(cat /tmp/lane-*.txt | grep -c '^ASYNC-MEASURED 1' || true)
          echo "the async pipeline measured in $measured of 20 runs"
          test "$failed" -eq 0
          # most runs must measure: 512 steps measured 20 of 20 on this runner
          test "$measured" -ge 10
          # a stall is a gap over 50 ms (each measured run says its own). A compile that blocks the thread stalls most
          # runs (stall_c near 20, stall_n near 0); the machine pausing the page now and then shows in both counts. The
          # margin is derived from the rate seen on this lane, about 1 chance stall in 20 runs: stall_c and stall_n are
          # then each Poisson(1), their difference Skellam(1, 1), and a lane with no blocking compile goes red when the
          # difference exceeds the margin: P(D > 1) = 13.0 %, P(D > 2) = 3.7 %, P(D > 3) = 0.84 %. Margin 3
          stall_c=$(cat /tmp/lane-*.txt | grep -c '^STALL compile' || true)
          stall_n=$(cat /tmp/lane-*.txt | grep -c '^STALL control' || true)
          echo "stalls over 50 ms: $stall_c of $measured runs while compiling, $stall_n without a compile"
          test "$stall_c" -le $((stall_n + 3))

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
