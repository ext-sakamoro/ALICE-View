name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-View

      # siblings at the commits pinned in .github/actions/siblings (one place)
      # - ALICE-Zip: alice-lol depends on alice-zip unconditionally (`research_law`),
      #   so it is compiled by the default build and cannot be stubbed
      # - ALICE-Analytics: real checkout rather than a stub: `analytics_bridge` names
      #   types from this crate, so an empty stub fails to compile (and a stub that
      #   compiles would be a test double with nothing in it); make-stubs.py skips
      #   any sibling that is already present
      - name: Fetch pinned sibling repositories
        uses: ./ALICE-View/.github/actions/siblings
        with:
          repos: ALICE-SDF ALICE-LOL ALICE-Zip ALICE-Analytics

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-View

      # stub の version / features は `Cargo.toml` から導出する (literal を書かない)
      # workflow に literal を置くと source of truth が 2 つになり、path dep の
      # version を動かした commit で CI が resolve 段階から落ちる 判定 (どの dep を
      # stub にしてよいか) も script 側で機械的に出す 詳細は make-stubs.py の docstring
      - name: Create dependency stubs
        shell: bash
        run: python3 ALICE-View/.github/make-stubs.py

      - name: Build (default)
        working-directory: ALICE-View
        run: cargo build --lib

      - name: Test
        working-directory: ALICE-View
        run: cargo test --lib

      # The bridge sits behind an optional feature, so the default build never
      # compiles it. It was broken for that reason: it imported a `prelude`
      # module that no longer exists, and nothing noticed.
      - name: Check the analytics bridge (optional feature)
        working-directory: ALICE-View
        run: cargo check --lib --features analytics

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      # RUSTSEC-2026-0235 interim: this crate must not depend on rkyv directly
      # or archive anything through it (rkyv is reached only via alice-db, whose
      # archived types hold no Rc / Arc). The guard fails as soon as that changes.
      - name: no-direct-rkyv guard (tests)
        run: python3 scripts/test_no_direct_rkyv.py
      - name: no-direct-rkyv guard
        run: python3 scripts/no_direct_rkyv.py

  web:
    name: Web worker renderer (crates/alice-view-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/alice-view-web
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy (wasm32, with and without the probe)
        run: |
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --release --target wasm32-unknown-unknown --features probe -- -D warnings

      # the CLI must be the same version as the wasm-bindgen crate the build resolved
      - name: Install wasm-bindgen-cli
        run: |
          v=$(cargo metadata --format-version 1 | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'wasm-bindgen'))")
          cargo install wasm-bindgen-cli --version "$v" --locked

      - name: Size gate
        run: python3 probe/size.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Browser checks (SwiftShader WebGPU, then none)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server -d probe 18802 --bind 127.0.0.1 &
          sleep 2
          ln -s "$PWD/node_modules" probe/node_modules
          # the runner's WebGPU is SwiftShader, which loses the device while a second pipeline compiles
          # asynchronously in a worker (measured with a plain-JS worker too): the async pipeline is measured on a real
          # GPU, not here; the device, the mirror, the fallback and the size are
          PROBE_ADAPTER=swiftshader PROBE_ASYNC=skip PROBE_CHROME_ARGS="--use-webgpu-adapter=swiftshader" node probe/check.mjs http://127.0.0.1:18802/index.html webgpu
          node probe/check.mjs http://127.0.0.1:18802/index.html none

      # SwiftShader again, with Chromium's Vulkan flags: then its device stays alive, so the drawing and the async
      # pipeline are measured here (the mechanism, not a GPU's time; a real GPU measured the same way: an NVIDIA Ampere,
      # 10 of 10). The lane asserts the adapter it names
      - name: Browser checks on software WebGPU with Vulkan flags (SwiftShader, device kept)
        run: |
          python3 -m http.server -d probe 18803 --bind 127.0.0.1 &
          sleep 2
          PROBE_ADAPTER=swiftshader PROBE_CHROME_ARGS="--use-angle=vulkan --ignore-gpu-blocklist --disable-gpu-sandbox --disable-vulkan-surface" node probe/check.mjs http://127.0.0.1:18803/index.html webgpu

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # siblings come only from .github/actions/siblings (pinned commits); the
      # self-test first shows the check catches each kind of violation
      - name: Sibling pin check (self-test, then the workflows)
        run: |
          python3 .github/test_check_sibling_pins.py
          python3 .github/check_sibling_pins.py
      # release.yml runs make-stubs.py on Windows, whose default stdout encoding is
      # cp1252; its output has non-ASCII text, so run it once with that encoding
      - name: make-stubs.py under a cp1252 stdout (as on Windows)
        env:
          PYTHONIOENCODING: cp1252
        run: python3 .github/make-stubs.py --allow-stub-all
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
