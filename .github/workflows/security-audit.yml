name: Security & Hygiene

# ALICE-SDF v1.7.7 (commit 52d26f9) を base に ALICE-View 用に調整
#
# 目的:
# - RustSec advisory (CVE) の週次検知
# - dep license 逸脱 (GPL 侵入等) の block
# - 未使用依存の炙り出し (wgpu / egui bloat 予防)
# - 仮実装 (todo! / unimplemented! / panic!(STUB) / dbg!) の CI gate

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/**'
      - '.github/semver_gate.py'
      - '.github/test_semver_gate.py'
      - '.github/paths/security-audit.txt'
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `shell: bash` gives `-eo pipefail` to every run step
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/security-audit.txt

  audit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # advisory-db は audit 実行時に自動取得
      # yanked crate は deny、unmaintained warning は個別 ignore で管理
      # RUSTSEC-2026-0235 (rkyv 0.7 Rc/Arc archive validation): rkyv is reached only
      # through alice-db (db feature), whose archived types (SegmentMetadata / DataSegment /
      # ModelType / DataType) hold no Rc / Arc, so the advisory does not apply. This crate
      # neither depends on rkyv nor archives anything; scripts/no_direct_rkyv.py fails as soon
      # as either changes. The root fix is alice-db moving off rkyv 0.7 (pending); the entry
      # goes when that release is consumed.
      - name: Run cargo audit
        run: |
          cargo audit --deny yanked \
            --ignore RUSTSEC-2026-0235

  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      # EmbarkStudios/cargo-deny-action@v2 は Docker container 内で稼働し、
      # /github/workspace のみ mount するため sibling path dep が見えず fail する
      # 直接 install で回避 (action 版は advisory-db の取得で失敗する事例がある)
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      # false-positive は Cargo.toml の [package.metadata.cargo-machete] ignored で除外
      - uses: bnjbvr/cargo-machete@main

  stub-guard:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect todo! / unimplemented! / panic!(STUB) in src/**
        run: |
          set -eo pipefail
          # STUB (uppercase) のみに絞る (小文字の stub は通常語として現れる)
          # trait default method の `panic!("... not implemented by this backend")`
          # 等は legitimate な pattern で stub ではない
          hits=$(grep -rnE 'todo!\(|unimplemented!\(|panic!\([^)]*STUB' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ Stub / unimplemented / STUB panic detected in src/ (production path):"
            echo "$hits"
            echo ""
            echo "Fix: use ? operator, Result<T, E>, or remove the stub."
            exit 1
          fi
          echo "✓ No todo! / unimplemented! / panic!(STUB) in src/ (excluding src/bin/)"

      - name: Detect dbg!() residual in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "❌ dbg!() macro left in src/:"
            echo "$hits"
            exit 1
          fi
          echo "✓ No dbg!() in src/"

      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            head -50 <<<"$hits"
          else
            echo "✓ No TODO/FIXME/XXX/HACK in src/"
          fi

  coverage:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Coverage (cargo-llvm-cov、informational)
    runs-on: ubuntu-latest
    # The coverage figure is informational; a build or test failure is not.
    # This job used to run with `continue-on-error: true` on stubs of the
    # siblings the lib compiles, and failed to compile (E0432 on alice_sdf)
    # while reporting success.
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-View

      # siblings at the commits pinned in .github/actions/siblings (one place)
      - name: Fetch pinned sibling repositories
        uses: ./ALICE-View/.github/actions/siblings
        with:
          repos: ALICE-SDF ALICE-LOL ALICE-Zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-View

      - name: Create dependency stubs
        run: python3 ALICE-View/.github/make-stubs.py

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        working-directory: ALICE-View
        run: |
          cargo llvm-cov --lib --summary-only 2>&1 | tee coverage-summary.txt
          # no threshold yet: the line coverage when this job first ran for real
          # (2026-10-13) was 44.94%, recorded as the baseline next to today's figure
          {
            echo "### Coverage (informational, no threshold yet; baseline 2026-10-13: lines 44.94%)"
            grep -E '^TOTAL' coverage-summary.txt || { echo "no TOTAL line"; exit 1; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: ALICE-View/coverage-summary.txt
          retention-days: 30

  semver-checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-semver-checks (API compat、informational)
    runs-on: ubuntu-latest
    # Compared with the state before the change (.github/semver_gate.py: the
    # commit main pointed to before a push, the merge base for a pull request or
    # a branch, the last release tag on a schedule). alice-view is consumed by
    # other repositories (ALICE-Eco-System, ALICE-View-Studio, ALICE-Animation),
    # so a change whose version bump is lower than its lints need fails
    # (check-release compares the two Cargo.toml versions with the lint level
    # itself); a run that compared nothing fails too, except across a major bump,
    # where the tool runs no checks. It used to run with `|| true` and
    # `continue-on-error: true` and checked nothing: the latest
    # cargo-semver-checks needs rustc >= 1.93 and rust-toolchain.toml pins
    # 1.92.0, and the lib was built on stubs of the siblings it compiles.
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-View
          fetch-depth: 0  # the HEAD~1 baseline needs the history

      # siblings at the commits pinned in .github/actions/siblings (one place)
      - name: Fetch pinned sibling repositories
        uses: ./ALICE-View/.github/actions/siblings
        with:
          repos: ALICE-SDF ALICE-LOL ALICE-Zip ALICE-Analytics ALICE-Physics ALICE-DB

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-View

      - name: Create dependency stubs
        run: python3 ALICE-View/.github/make-stubs.py

      # Pinned: 0.50.0 and later need rustc >= 1.93, and rust-toolchain.toml
      # pins 1.92.0 (0.49.0 is the last release that supports 1.92). Unpin (or
      # move to the latest) when rust-toolchain.toml moves to 1.93 or later.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.49.0

      - name: "Self-test: semver baseline and decision"
        working-directory: ALICE-View
        run: python3 .github/test_semver_gate.py

      - name: Run cargo semver-checks
        working-directory: ALICE-View
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          # the baseline is the state before this change (see .github/semver_gate.py),
          # checked out next to this one: --baseline-rev unpacks it under target/,
          # where the ../ALICE-* path dependencies do not resolve
          base=$(python3 .github/semver_gate.py baseline "$EVENT" "${BEFORE:-}" "$BASE_REF" 2>baseline-reason.txt)
          cat baseline-reason.txt
          git worktree add --detach ../ALICE-View-baseline "$base"
          # a sibling that moved past a requirement of the baseline (alice-db "0.4" against
          # a sibling at 0.5.0) is resolved from the registry for the baseline only
          python3 .github/semver_gate.py relax ../ALICE-View-baseline | tee -a baseline-reason.txt
          set +e
          cargo semver-checks check-release --package alice-view --baseline-root ../ALICE-View-baseline 2>&1 | tee semver.log
          rc=${PIPESTATUS[0]}
          set -e
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          base_version=$(grep -m1 '^version' ../ALICE-View-baseline/Cargo.toml | cut -d'"' -f2)
          set +e
          verdict=$(python3 .github/semver_gate.py decide semver.log "$rc")
          pass=$?
          set -e
          {
            echo "### cargo-semver-checks"
            echo "alice-view $version against $(git rev-parse --short "$base") ($EVENT baseline, version $base_version)"
            cat baseline-reason.txt
            echo "${verdict#::*::}"
            sed -E 's/\x1b\[[0-9;]*m//g' semver.log | grep -E 'Checked|Summary|FAIL' | head -20 || true
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$verdict"
          exit "$pass"

  gate:
    name: Gate
    if: always()
    needs: [changes, audit, deny, unused-deps, stub-guard, coverage, semver-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
