name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

# All ALICE crates that appear as transitive path dependencies.
# Cargo resolves every path dep (even optional) at resolution time,
# so we must checkout them all.
env:
  SIBLING_REPOS: >-
    ALICE-SDF
    ALICE-Analytics
    ALICE-Physics
    ALICE-DB
    ALICE-Codec
    ALICE-Streaming-Protocol
    ALICE-Cache
    ALICE-Font
    ALICE-ML
    ALICE-Crypto
    ALICE-Voice
    ALICE-Sync
    ALICE-Queue
    ALICE-Zip
    ALICE-Text
    ALICE-Auth
    ALICE-Search

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: alice-view-windows-x86_64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: alice-view-linux-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: alice-view-macos-aarch64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Checkout sibling ALICE crates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for repo in $SIBLING_REPOS; do
            echo "::group::Cloning $repo"
            git clone --depth 1 \
              "https://github.com/ext-sakamoro/${repo}.git" \
              "../${repo}" || true
            echo "::endgroup::"
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --lib --target ${{ matrix.target }}

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          ARCHIVE="${{ matrix.artifact }}-${TAG}.tar.gz"
          tar czf "$ARCHIVE" \
            -C "target/${{ matrix.target }}/release" \
            alice-view${{ matrix.ext }} alice-create${{ matrix.ext }}
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = "${{ steps.tag.outputs.version }}"
          $ARCHIVE = "${{ matrix.artifact }}-${TAG}.zip"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/alice-view${{ matrix.ext }}", `
                  "target/${{ matrix.target }}/release/alice-create${{ matrix.ext }}" `
            -DestinationPath $ARCHIVE
          "ARCHIVE=$ARCHIVE" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.version }}"
          gh release upload "$TAG" "$ARCHIVE" --clobber
