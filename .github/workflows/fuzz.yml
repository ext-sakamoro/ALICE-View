name: Fuzz

# ALICE-SDF v1.7.7 (commit 52d26f9) を base に ALICE-View 用に調整
#
# 目的:
# - 3 fuzz target (fuzz_alice_decode / fuzz_alice_header / fuzz_alice_metadata) を time-boxed 実行
# - 攻撃者制御 .alice file (file / header / metadata JSON tail) で panic ゼロ + OOM 予防を検証
#
# 注意点:
# - cargo-fuzz は nightly toolchain 必須 (rust-toolchain 不使用時も明示指定)

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - '.github/make-stubs.py'
      - 'src/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/**'
      - '.github/paths/fuzz.txt'
  schedule:
    # 毎日 03:00 UTC = 12:00 JST (idle 時間帯)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# `shell: bash` gives `-eo pipefail` to every run step
defaults:
  run:
    shell: bash

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/fuzz.txt

  fuzz:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Fuzz — ${{ matrix.target }}
    runs-on: ubuntu-latest
    # A crash or a build failure fails this job. It used to run with
    # `continue-on-error: true`, and every target had been failing to compile
    # (E0432 on alice_sdf: the lib was built on an empty stub of a sibling it
    # compiles) while the run reported success.
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_alice_decode
          - fuzz_alice_header
          - fuzz_alice_metadata
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-View

      # siblings at the commits pinned in .github/actions/siblings (one place)
      - name: Fetch pinned sibling repositories
        uses: ./ALICE-View/.github/actions/siblings
        with:
          repos: ALICE-SDF ALICE-LOL ALICE-Zip

      # cargo-fuzz は nightly toolchain 必須
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-View/fuzz

      # stubs only for the siblings no build here compiles (versions and
      # features derived from Cargo.toml; it fails loudly for a compiled one)
      - name: Create dependency stubs
        run: python3 ALICE-View/.github/make-stubs.py

      - name: Install Linux dependencies (for wgpu / winit build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      - name: Run fuzz target (time-boxed)
        run: |
          cd ALICE-View/fuzz
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }}

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ALICE-View/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Gate
    if: always()
    needs: [changes, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
