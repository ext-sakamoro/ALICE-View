name: 'ALICE-View Optional Bridge Stubs'
description: |
  Create stub crates for the ALICE-View sibling path deps so that jobs which
  only need the dependency graph to resolve (cargo audit / cargo deny /
  semver-checks / fuzz) do not have to clone every sibling repository.

  版と feature は `.github/make-stubs.py` が `Cargo.toml` から導出する
  ⚠️ ここに literal を書かない — `Cargo.toml` の要求を動かした時に stub が
  追従せず、resolve 段階で全 job が落ちる (optional dep も lock に載るので
  feature 無効でも解決される) 2026-10-08 までは literal を書いていて、
  `alice-analytics` を 0.3 に上げた時に 2 箇所の同期が必要だった

  ⚠️ `--allow-stub-all` は「消費側の lib を既定 feature で compile しない job」
  専用 compile する job (ci.yml の build / test) では real checkout を使う
  (ci.yml は `make-stubs.py` を flag 無しで呼び、compile される dep に stub を
  置こうとしたら loud fail する)

  license = "MIT OR Apache-2.0" は make-stubs.py が入れる
  (欠落すると cargo-deny が unlicensed として reject する)

runs:
  using: composite
  steps:
    - shell: bash
      run: python3 "${{ github.action_path }}/../../make-stubs.py" --allow-stub-all
