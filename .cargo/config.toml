# Cargo build profile
#
# 注: `target-cpu=native` は意図的に削除
# 理由: CI Ubuntu runner で `rustc interrupted by SIGILL` (= rustc 自身が CI CPU
#       未サポート命令で crash、commit 7066114 で実発覚)
#       ローカルで native 最適化したい場合は環境変数で opt-in:
#         export RUSTFLAGS="-C target-cpu=native"
#         cargo build --release
#       または `.cargo/config.local.toml` (= gitignore) に同設定を置く

[build]
# rustflags = []
