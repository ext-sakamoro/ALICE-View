# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# canonical CI template: [[reference_alice_ci_canonical_template]]
# ALICE-SDF v1.7.7 (commit 52d26f9) の deny.toml を base に ALICE-View 用に調整
#
# ALICE-View 自体は MIT OR Apache-2.0 (permissive) のため自己 exception 不要
# sibling stubs (alice-sdf / alice-lol / alice-analytics / alice-physics / alice-db) は
# alice-stubs action で "MIT OR Apache-2.0" で生成される (canonical 罠 #2 予防)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser unmaintained (RUSTSEC-2026-0192、epaint/egui transitive、font 描画に必須)
    # 代替 skrifa (Google fontations) 移行は upstream egui/wgpu の判断待ち
    "RUSTSEC-2026-0192",
    # paste unmaintained (pyo3-macros / bytemuck 等 transitive)
    "RUSTSEC-2024-0436",
    # bincode unmaintained (alice-sdf 経由、.asdf の wire format 互換のため据置)
    # ⚠️ patched = [] なので **どの version に上げても消えない** 上流の ALICE-SDF が
    # 同じ理由で既に ignore しており (deny.toml:26)、ALICE-* 50 repo 中 31 repo が同様
    # ここに無いのは ALICE-View 側の entry 漏れだった 代替 (postcard / bitcode) への
    # 移行は wire format が変わるので ALICE-SDF 側の判断
    "RUSTSEC-2025-0141",
    # rkyv 0.7 の Rc/Arc archive validation OOB (alice-db 経由、db feature 時のみ)
    # 脆弱性は **archive された型が Rc/Arc を含む**場合に成立する alice-db の
    # rkyv derive 型は SegmentMetadata / DataSegment / ModelType の 3 つで、field は
    # primitive と Vec / Option<Vec> のみ = 非該当 (2026-09-29 に定義を読んで確認)
    # ⚠️ 0.7 系は upstream 非サポートなので、恒久対応は alice-db の rkyv 0.8 移行
    # (0.7 -> 0.8 は API 破壊、別 repo の作業) 上流 ALICE-DB も同じ理由で ignore 済
    "RUSTSEC-2026-0235",
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    # Font-related licenses (epaint_default_fonts / egui 経由)
    "OFL-1.1",           # SIL Open Font License (Ubuntu Mono / Noto 等)
    "Ubuntu-font-1.0",   # Ubuntu Font License
    # LLVM ecosystem
    "NCSA",              # libfuzzer-sys / LLVM related
]

# optional な ALICE sibling は `AGPL-3.0-or-later OR LicenseRef-Commercial` の
# デュアルで、allow-list 方式では両辺とも通らない (canonical 罠 #7)
# ⚠️ これは **gate を通すための exception であって、伝播を解消するものではない**
# ALICE-View 自身は permissive 宣言なので、`db` / `physics` feature を有効にした
# 配布物は AGPL 側の条件を負う README への明示は別途 Backlog (対応 C) にある
[[licenses.exceptions]]
name = "alice-db"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-physics"
allow = ["AGPL-3.0-or-later"]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
